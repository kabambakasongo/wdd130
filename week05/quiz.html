<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html and CSS | Quiz</title>
    <meta name="description" content="The basic question in Html and CSS.">
    <meta name="author" content="Kabamba Kasongo Ledoux">
    <title>HTML &amp; CSS Quiz</title>

    <link rel="stylesheet" href="../styles/quiz.css">
</head>

<body>
    <h1>HTML &amp; CSS Quiz</h1>
    <form action="quiz.html" method="get">
        <fieldset>
            <legend>Quiz Questions</legend>

            <section class="quiz-question">
                <label for="q1">1. What is the fill in the blank HTML element used to define a
                    paragraph?</label>
                <input type="text" name="q1" id="q1" required>
            </section>

            <section class="quiz-question">
                <label for="q2">2. In a few sentences, explain the difference between a margin and a
                    padding.</label>
                <textarea name="q2" id="q2" rows="4" required></textarea>
            </section>

            <section class="quiz-question">
                <label for="q3">3. Which selector has the highest specificity in CSS?</label>
                <select name="q3" id="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="element">Element selector (p)</option>
                    <option value="class">Class selector (.intro)</option>
                    <option value="id">ID selector (#main)</option>
                </select>
            </section>

            <section class="quiz-question">
                <label for="q4">4. How many top-level headings (h1) are allowed in a valid HTML5
                    document?</label>
                <input type="number" name="q4" id="q4" min="0" max="10" step="1" required>
            </section>

            <button type="submit">Submit Quiz</button>
        </fieldset>
    </form>

    <footer>
        <p>© 2026 Html and CSS Quiz | Kabamba Kasongo Ledoux</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin-square.svg" alt="Linkedin Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-square.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
